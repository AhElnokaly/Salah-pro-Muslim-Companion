        <div id="recovery-box" style="display: none; margin-top: 14px; max-width: 320px;">
          <p style="font-size: 12px; color: #059669; margin-bottom: 10px; line-height: 1.5; font-weight: 600;">استغرق التحميل وقتاً أطول من المعتاد. يمكنك تحديث الذاكرة المخبئية بضغطة واحدة:</p>

    <script>
      // Global resource error detection (catches network hiccups or cold container boots)
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var src = e.target.src || e.target.href || '';
          console.warn('[BootGuard] Network hiccup loading module asset:', src);

          // If main entry point failed to load (e.g. cold start / container waking up), attempt clean self-healing reload
          if (src.indexOf('/src/main.tsx') !== -1) {
            try {
              var retryCount = parseInt(sessionStorage.getItem('boot_retry_count') || '0', 10);
              if (retryCount < 2) {
                sessionStorage.setItem('boot_retry_count', String(retryCount + 1));
                console.log('[BootGuard] Container waking up, scheduling self-healing reload (attempt ' + (retryCount + 1) + ')...');

                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    for (var i = 0; i < regs.length; i++) regs[i].unregister();
                  }).catch(function() {});
                }

                setTimeout(function() {
                  window.location.reload();
                }, 1200);
                return;
              }
              sessionStorage.removeItem('boot_retry_count');
            } catch (err) {
              // Ignore storage errors
            }
          }

          var box = document.getElementById('recovery-box');
          if (box) {
            box.style.display = 'block';
          }
        }
      }, true);

      setTimeout(function() {
        var box = document.getElementById('recovery-box');
        if (box && document.getElementById('boot-loader')) {
          box.style.display = 'block';
        }
      }, 7000);

      function clearAndReload() {
        var btn = document.querySelector('#recovery-box button');
        if (btn) {
          btn.innerText = 'جاري التحديث والتنظيف... ⏳';
          btn.disabled = true;
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            var promises = [];
            for (var i = 0; i < regs.length; i++) {
              promises.push(regs[i].unregister());
            }
            return Promise.all(promises);
          }).then(function() {
            if ('caches' in window) {
              return caches.keys().then(function(keys) {
                var cachePromises = [];
                for (var key of keys) cachePromises.push(caches.delete(key));
                return Promise.all(cachePromises);
              });
            }
          }).finally(function() {
            window.location.href = window.location.origin + window.location.pathname + '?nocache=' + Date.now();
          });
        } else {
          window.location.href = window.location.origin + window.location.pathname + '?nocache=' + Date.now();
        }
      }
    </script>
