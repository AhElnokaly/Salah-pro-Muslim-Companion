name: Verify R12 & R13 Quality Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify R12 & R13 (TypeScript, Tests, Invariance, Unit Tests, APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Strict TypeScript Check
        run: npx tsc --noEmit

      - name: 2. Automated Test Suite
        run: npm test

      - name: 3. Timezone Invariance Suite
        run: node scripts/test_tz_invariance.cjs

      - name: Prepare Android Web Assets & Sync
        run: |
          npm run build
          npx cap sync android
          chmod +x android/gradlew

      - name: 4. Kotlin Unit Tests (JVM)
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 5. Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R12-R13-Verified-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
