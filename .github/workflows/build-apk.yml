name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v4

      - name: Set up Java 21 ☕
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install NPM Dependencies 📦
        run: npm install --legacy-peer-deps

      - name: Build Web Assets for Mobile 🏗️
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Ensure Android Platform Exists 📱
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Android wrapper missing, adding android platform..."
            npx cap add android
          fi

      - name: Sync Capacitor Android Project 🔄
        run: npx cap sync android

      - name: Grant Executable Permissions to Gradlew 🔑
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Verify Gradle Wrapper Integrity 🔍
        run: |
          unzip -t android/gradle/wrapper/gradle-wrapper.jar
          cd android && ./gradlew --version

      - name: Build Debug APK with Gradle ⚙️
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK & Generate Checksum 🛡️
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk not found!"
            exit 1
          fi
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload APK Artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: Hemmaty-APK-Debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30

      - name: Create GitHub Release for Tags 🚀
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

