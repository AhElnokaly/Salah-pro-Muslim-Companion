name: Build Android APK (Debug)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Package Android APK (Debug)
    runs-on: ubuntu-latest
    concurrency:
      group: build-debug-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v4

      - name: Set up Java 21 ☕
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install NPM Dependencies 📦
        run: npm ci

      - name: Unit Tests & Quality Gate 🛡️
        run: |
          npm run lint
          npm test

      - name: Build Web Assets for Mobile 🏗️
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Ensure Android Platform Exists 📱
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Android wrapper missing, adding android platform..."
            npx cap add android
          fi

      - name: Sync Capacitor Android Project 🔄
        run: npx cap sync android

      - name: Grant Executable Permissions to Gradlew 🔑
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Setup Gradle Build Environment 🐘
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: Ensure Gradle Wrapper Binary Integrity 🔍
        run: |
          # If the local jar is damaged, download the authentic wrapper jar
          if ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "⚠️ Corrupted gradle-wrapper.jar detected. Fetching genuine Gradle 8.14.3 wrapper..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" -o "android/gradle/wrapper/gradle-wrapper.jar"
          fi
          unzip -t android/gradle/wrapper/gradle-wrapper.jar
          cd android && ./gradlew --version

      - name: Build Debug APK with Gradle ⚙️
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK & Generate Checksum 🛡️
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk not found!"
            exit 1
          fi
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload APK Artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: Hemmaty-APK-Debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30

