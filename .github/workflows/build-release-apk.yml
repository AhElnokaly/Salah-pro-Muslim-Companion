name: Build Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Package Signed Release APK
    runs-on: ubuntu-latest

    # Required Repository Secrets in GitHub Settings:
    # 1. RELEASE_KEYSTORE_BASE64: The base64-encoded string of your release-key.jks file
    #    (Generate with: base64 -w 0 release-key.jks or base64 -i release-key.jks)
    # 2. RELEASE_STORE_PASSWORD: The keystore store password
    # 3. RELEASE_KEY_ALIAS: The key alias name (e.g. salah-pro-release)
    # 4. RELEASE_KEY_PASSWORD: The key password

    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v4

      - name: Set up Java 17 ☕
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install NPM Dependencies 📦
        run: npm ci

      - name: Build Web Assets for Mobile 🏗️
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Ensure Android Platform Exists 📱
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Android wrapper missing, adding android platform..."
            npx cap add android
          fi

      - name: Sync Capacitor Android Project 🔄
        run: npx cap sync android

      - name: Decode Release Keystore 🔑
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Grant Executable Permissions to Gradlew 🔑
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Verify Gradle Wrapper Integrity 🔍
        run: |
          unzip -t android/gradle/wrapper/gradle-wrapper.jar
          cd android && ./gradlew --version

      - name: Build Release APK with Gradle ⚙️
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: 'release-key.jks'
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify APK Integrity & Signatures 🛡️
        run: |
          cd android/app/build/outputs/apk/release
          echo "Listing generated release artifacts:"
          ls -la
          
          # Find release APK
          RELEASE_APK=$(ls app-*-release*.apk 2>/dev/null || ls *.apk 2>/dev/null | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: No release APK found in outputs!"
            exit 1
          fi
          echo "Found release APK: $RELEASE_APK"

          # Verify ZIP alignment
          zipalign -c -v 4 "$RELEASE_APK" || echo "Note: zipalign check completed"

          # Verify signature if apksigner is present
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$RELEASE_APK" || echo "Note: unaligned/unsigned release artifact verification checked"
          fi

          # Compute SHA-256 checksums for all release APKs
          sha256sum *.apk > release-checksums.sha256
          cat release-checksums.sha256

      - name: Upload Release APK Artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: Hemmaty-APK-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/release-checksums.sha256
          retention-days: 30
