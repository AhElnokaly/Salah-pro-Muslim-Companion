name: Build Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Package Signed Release APK
    runs-on: ubuntu-latest
    concurrency:
      group: build-release-${{ github.ref }}
      cancel-in-progress: true

    # Supported Repository Secrets in GitHub Settings:
    # 1. DEBUG_KEYSTORE_BASE64: The base64-encoded string of your debug.keystore (e.g. from Woman-Companion-App)
    # 2. RELEASE_KEYSTORE_BASE64: The base64-encoded string of your release-key.jks file
    # 3. RELEASE_STORE_PASSWORD: The keystore store password
    # 4. RELEASE_KEY_ALIAS: The key alias name
    # 5. RELEASE_KEY_PASSWORD: The key password

    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v4

      - name: Set up Java 21 ☕
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install NPM Dependencies 📦
        run: npm ci

      - name: Unit Tests & Quality Gate 🛡️
        run: |
          npm run lint
          npm test

      - name: Build Web Assets for Mobile 🏗️
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Ensure Android Platform Exists 📱
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Android wrapper missing, adding android platform..."
            npx cap add android
          fi

      - name: Sync Capacitor Android Project 🔄
        run: npx cap sync android

      - name: Restore Keystores from Secrets 🔑
        run: |
          mkdir -p ~/.android
          # 1. Debug Keystore (matches Woman-Companion-App secret for seamless update signature)
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Installing DEBUG_KEYSTORE_BASE64 to ~/.android and android/app..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
          fi
          # 2. Release Keystore (if provided)
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Installing RELEASE_KEYSTORE_BASE64 to android/app..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks
          fi

      - name: Grant Executable Permissions to Gradlew 🔑
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Setup Gradle Build Environment 🐘
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: Ensure Gradle Wrapper Binary Integrity 🔍
        run: |
          # If the local jar is damaged, download the authentic wrapper jar
          if ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "⚠️ Corrupted gradle-wrapper.jar detected. Fetching genuine Gradle 8.14.3 wrapper..."
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" -o "android/gradle/wrapper/gradle-wrapper.jar"
          fi
          unzip -t android/gradle/wrapper/gradle-wrapper.jar
          cd android && ./gradlew --version

      - name: Compute Build Versioning 🏷️
        id: versioning
        run: |
          # If triggered by a tag like v1.0.6, extract 1.0.6; otherwise read package.json
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME=$(node -p "require('./package.json').version" 2>/dev/null || echo "1.0.8")
          fi
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          
          # Strictly sequential versionCode: base 1000 + github.run_number
          BUILD_CODE=$(( 1000 + ${{ github.run_number }} ))
          echo "version_code=$BUILD_CODE" >> "$GITHUB_OUTPUT"
          echo "Sequential Versioning -> versionCode: $BUILD_CODE, versionName: $VERSION_NAME, tag: $TAG_NAME"

      - name: Build Release APK with Gradle ⚙️
        run: |
          cd android
          ./gradlew assembleRelease -PappVersionCode=${{ steps.versioning.outputs.version_code }} -PappVersionName=${{ steps.versioning.outputs.version_name }} --stacktrace
        env:
          APP_VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          RELEASE_KEYSTORE_PATH: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && 'release-key.jks' || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify APK Integrity & Signatures 🛡️
        run: |
          cd android/app/build/outputs/apk/release
          echo "Listing generated release artifacts:"
          ls -la
          
          # Find release APK
          RELEASE_APK=$(ls app-*-release*.apk 2>/dev/null || ls *.apk 2>/dev/null | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: No release APK found in outputs!"
            exit 1
          fi
          echo "Found release APK: $RELEASE_APK"

          # Locate Android SDK build-tools directory and prepend to PATH
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "Using Android build-tools: $BUILD_TOOLS_DIR"
            export PATH="$BUILD_TOOLS_DIR:$PATH"
          fi

          # Strict ZIP alignment verification
          if ! command -v zipalign >/dev/null 2>&1; then
            echo "ERROR: zipalign is required for release verification but was not found in PATH or $ANDROID_HOME/build-tools!"
            exit 1
          fi
          echo "Verifying ZIP alignment (4-byte boundary) on $RELEASE_APK..."
          zipalign -c -v 4 "$RELEASE_APK"

          # Cryptographic signature verification
          if ! command -v apksigner >/dev/null 2>&1; then
            echo "ERROR: apksigner is required for release verification but was not found in PATH or $ANDROID_HOME/build-tools!"
            exit 1
          fi
          echo "Verifying cryptographic APK signature with apksigner on $RELEASE_APK..."
          if ! apksigner verify --verbose "$RELEASE_APK"; then
            echo "CRITICAL ERROR: Release APK is NOT signed or signature verification failed! Failing build to prevent distributing unsigned/invalid APK."
            exit 1
          fi
          echo "Signature verification passed successfully!"

          # Compute SHA-256 checksums for all release APKs
          sha256sum *.apk > release-checksums.sha256
          cat release-checksums.sha256

      - name: Upload Release APK Artifact 📦
        uses: actions/upload-artifact@v4
        with:
          name: Hemmaty-APK-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/release-checksums.sha256
          retention-days: 30

      - name: Publish or Update GitHub Release with APK 🚀
        uses: softprops/action-gh-release@v2
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: "تطبيق همّتي ${{ steps.versioning.outputs.tag_name }} 🌙"
          body: |
            تحديث تلقائي جديد لتطبيق همّتي (Salah Pro).

            - **الإصدار**: `${{ steps.versioning.outputs.tag_name }}`
            - **رقم البناء (Build Code)**: `${{ steps.versioning.outputs.version_code }}`
            - **تاريخ الإصدار**: ${{ github.event.head_commit.timestamp || 'Latest' }}
            - **رسالة التحديث**: ${{ github.event.head_commit.message || 'تحسينات وإصلاحات مستمرة' }}

            📥 تم إرفاق حزمة الـ APK الموقعة رسمياً لدعم التحديث السلس والمباشر من داخل التطبيق.
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/release-checksums.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
